<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bakery 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#fff4e3}
#mainMenu{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:15px;z-index:10}
button{border:none;padding:15px 25px;border-radius:12px;background:white;color:#5b3924;font-size:18px;font-weight:bold;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2)}
button:hover{transform:scale(1.05);background:#f5d6b3}
#backBtn{position:fixed;left:30px;top:30px;z-index:20;display:none}
#loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;color:#5b3924;z-index:30}
</style>
</head>

<body>

<div id="loading">กำลังโหลดร้านเบเกอรี่...</div>

<div id="mainMenu">
<button id="menuBtn">Menu</button>
<button id="portfolioBtn">Portfolio</button>
</div>

<button id="backBtn">← กลับ</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

let scene=new THREE.Scene();
scene.background=new THREE.Color(0xfff4e3);

let camera=new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
1000
);

let renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

let controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;

scene.add(new THREE.AmbientLight(0xffffff,.7));

let light=new THREE.DirectionalLight(0xffffff,.5);
light.position.set(10,15,10);
scene.add(light);

let bakery;

let homeCameraPosition;
let homeTarget;

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

const loader=new THREE.GLTFLoader();

loader.load(
'Bekery(1).glb',
function(gltf){

bakery=gltf.scene;
scene.add(bakery);

console.log('Bakery loaded');
console.log('Cube.041:',bakery.getObjectByName('Cube.041'));
console.log('Cube.034:',bakery.getObjectByName('Cube.034'));

const box=new THREE.Box3().setFromObject(bakery);
const center=box.getCenter(new THREE.Vector3());
const size=box.getSize(new THREE.Vector3());

const maxSize=Math.max(size.x,size.y,size.z);

camera.position.set(
center.x,
center.y+maxSize*.35,
center.z+maxSize*1.8
);

controls.target.copy(center);
controls.update();

homeCameraPosition=camera.position.clone();
homeTarget=controls.target.clone();

document.getElementById('loading').style.display='none';

},
undefined,
function(error){
console.error(error);
document.getElementById('loading').innerText='โหลดโมเดลไม่สำเร็จ';
}
);


// ========================================
// คลิก Cube.041
// ========================================

renderer.domElement.addEventListener(
'click',
function(event){

if(!bakery)return;

// ตำแหน่งเมาส์
mouse.x=(event.clientX/window.innerWidth)*2-1;
mouse.y=-(event.clientY/window.innerHeight)*2+1;

// ยิง Ray จากกล้องไปตำแหน่งที่คลิก
raycaster.setFromCamera(mouse,camera);

// ตรวจสอบวัตถุทั้งหมดใน Bakery
const intersects=raycaster.intersectObjects(
bakery.children,
true
);

if(intersects.length===0)return;

// วัตถุที่ถูกคลิก
let clickedObject=intersects[0].object;

console.log(
'คลิก:',
clickedObject.name
);


// ========================================
// เช็กว่าเป็น Cube.041 หรือไม่
// ========================================

let isCube041=false;

let currentObject=clickedObject;

while(currentObject){

if(currentObject.name==='Cube.041'){
isCube041=true;
break;
}

currentObject=currentObject.parent;

}


// ========================================
// ถ้าเป็น Cube.041 ให้ไป Cube.034
// ========================================

if(isCube041){

goToCube034();

}

});


// ========================================
// ไป Cube.034
// ========================================

function goToCube034(){

const target=bakery.getObjectByName('Cube.034');

if(!target){

console.error('ไม่พบ Cube.034');

return;

}

const box=new THREE.Box3().setFromObject(target);

const center=box.getCenter(
new THREE.Vector3()
);

const size=box.getSize(
new THREE.Vector3()
);

const maxSize=Math.max(
size.x,
size.y,
size.z
);


// ตำแหน่งกล้องด้านหน้า Cube.034
camera.position.set(
center.x,
center.y+maxSize*.8+1,
center.z+maxSize*2.5+2
);


// ให้กล้องมอง Cube.034
controls.target.copy(center);
controls.update();


// ซ่อนเมนู
document.getElementById(
'mainMenu'
).style.display='none';


// แสดงปุ่มกลับ
document.getElementById(
'backBtn'
).style.display='block';

}


// ========================================
// ปุ่มกลับ
// ========================================

document.getElementById(
'backBtn'
).addEventListener(
'click',
function(){

camera.position.copy(
homeCameraPosition
);

controls.target.copy(
homeTarget
);

controls.update();

document.getElementById(
'mainMenu'
).style.display='flex';

document.getElementById(
'backBtn'
).style.display='none';

});


// ========================================
// Menu
// ========================================

document.getElementById(
'menuBtn'
).addEventListener(
'click',
function(){

alert('ตรงนี้เอาไว้ทำระบบ Menu');

});


// ========================================
// Portfolio
// ========================================

document.getElementById(
'portfolioBtn'
).addEventListener(
'click',
function(){

window.open(
'https://example.com',
'_blank'
);

});


// ========================================
// Resize
// ========================================

window.addEventListener(
'resize',
function(){

camera.aspect=
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});


// ========================================
// Animation
// ========================================

function animate(){

requestAnimationFrame(animate);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

</script>
</body>
</html>
