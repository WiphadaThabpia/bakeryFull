<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakery 3D</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFF4E3;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    #backButton,
    #nextButton {
      position: fixed;
      z-index: 10;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #5a3a2e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      display: none;
    }

    #backButton {
      left: 20px;
      top: 20px;
    }

    #nextButton {
      right: 20px;
      bottom: 20px;
    }

    #backButton:hover,
    #nextButton:hover {
      transform: scale(1.05);
    }
  </style>
