<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakery 3D</title>
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: #FFF4E3; font-family: sans-serif;
    }
    canvas { display: block; }
    .btn {
      position: fixed; z-index: 10; padding: 12px 20px; border: none; border-radius: 10px;
      background: white; color: #5a3a2e; font-size: 16px; font-weight: bold; cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2); display: none; transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.05); }
    #backButton { left: 20px; top: 20px; }
    #nextButton { right: 20px; bottom: 20px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>
  <button id="backButton" class="btn">← กลับ</button>
  <button id="nextButton" class="btn">Menu Donut →</button>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xFFF4E3);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 30;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    
    const mainLight = new THREE.SpotLight(0xffffff, 2.5);
    mainLight.position.set(8, 10, 12);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const leftLight = new THREE.SpotLight(0xffffff, 1.5);
    leftLight.position.set(-8, 6, 8);
    scene.add(leftLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
    backLight.position.set(-5, -5, 8);
    scene.add(backLight);

    const clock = new THREE.Clock();
    const shaderTime = { value: 0.0 };
    const allShaders = [];
    let cakeMesh = null, bakery = null, flameMesh = null;

    const homeCamPos = new THREE.Vector3(), homeTarget = new THREE.Vector3();
    const startCam = new THREE.Vector3(), endCam = new THREE.Vector3();
    const startTarget = new THREE.Vector3(), endTarget = new THREE.Vector3();
    let currentPage = "home", movingCamera = false, moveStartTime = 0;
    const moveDuration = 1000;

    // สร้างเทียน (แท่งเทียนนิ่งๆ + เปลวไฟพริ้วไหวแบบนุ่มนวล)
    function createCandle() {
      const candleGroup = new THREE.Group();

      const bodyGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.5, 32);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFFB6C1 });
      const candleBody = new THREE.Mesh(bodyGeo, bodyMat);
      candleBody.position.y = 0.75;
      candleGroup.add(candleBody);

      const flameUniforms = {
        uTime: shaderTime,
        uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() }
      };

      const flameVertexShader = `
        uniform float uTime;
        varying vec3 vNormal;
        void main() {
          vNormal = normalMatrix * normal;
          vec3 pos = position;
          if (pos.y > -0.2) {
            float wave = sin(uTime * 6.0 + pos.y * 3.0) * 0.12 * (pos.y + 0.4);
            float wave2 = cos(uTime * 4.5 + pos.y * 2.0) * 0.08 * (pos.y + 0.4);
            pos.x += wave;
            pos.z += wave2;
          }
          gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(pos, 1.0);
        }
      `;

      const flameFragmentShader = `
        precision mediump float;
        uniform vec3 uLightDir;
        varying vec3 vNormal;
        void main() {
          vec3 color = vec3(1.0, 0.55, 0.1);
          vec3 N = normalize(vNormal);
          vec3 L = normalize(uLightDir);
          float diffuse = max(dot(N, L), 0.0);
          float ambient = clamp(diffuse * 4.0, 0.5, 1.0);
          diffuse = smoothstep(0.3, 0.5, diffuse);
          color = color * (diffuse + ambient);
          gl_FragColor = vec4(color, 1.0);
        }
      `;

      const flameMat = new THREE.ShaderMaterial({
        vertexShader: flameVertexShader,
        fragmentShader: flameFragmentShader,
        uniforms: flameUniforms,
        side: THREE.DoubleSide
      });

      const flameGeo = new THREE.ConeGeometry(0.25, 0.8, 32);
      flameMesh = new THREE.Mesh(flameGeo, flameMat);
      flameMesh.position.y = 1.9;
      candleGroup.add(flameMesh);

      return candleGroup;
    }

    const candleObj = createCandle();
    candleObj.position.set(-0.7, 6, 0); 
    scene.add(candleObj);

    new THREE.GLTFLoader().load(
      "https://raw.githubusercontent.com/WiphadaThabpia/bakeryFull/main/Bekery.glb",
      (gltf) => {
        bakery = gltf.scene;
        scene.add(bakery);

        bakery.traverse((object) => {
          if (!object.isMesh) return;
          object.castShadow = object.receiveShadow = true;

          if (object.name === "Plane.001" || object.name === "Plane001") {
            object.material = object.material.clone();
            object.material.side = THREE.DoubleSide;

            object.material.onBeforeCompile = (shader) => {
              shader.uniforms.uTime = shaderTime;

              shader.vertexShader = `
                uniform float uTime;
              ` + shader.vertexShader;

              shader.vertexShader = shader.vertexShader.replace(
                "#include <begin_vertex>",
                `
                #include <begin_vertex>
                transformed.z += sin(position.x * 5.0 + uTime) * 0.2;
                `
              );

              shader.fragmentShader = `
                uniform float uTime;
              ` + shader.fragmentShader;

              shader.fragmentShader = shader.fragmentShader.replace(
                "#include <color_fragment>",
                `
                #include <color_fragment>
                vec3 lightDir = normalize(vec3(0.4, 1.0, 0.8));
                float diffuse = max(dot(normalize(vNormal), lightDir), 0.0);
                float ambient = clamp(diffuse * 4.0, 0.5, 1.0);
                diffuse = smoothstep(0.4, 0.55, diffuse);
                diffuseColor.rgb = diffuseColor.rgb * (diffuse + ambient);
                `
              );
              allShaders.push(shader);
            };
            object.material.needsUpdate = true;
          }

          if (object.name === "Cylinder.024") {
            cakeMesh = object;
            object.material = object.material.clone();
            object.material.side = THREE.DoubleSide;

            object.material.onBeforeCompile = (shader) => {
              shader.uniforms.uTime = shaderTime;
              shader.fragmentShader = `uniform float uTime;\n` + shader.fragmentShader;

              shader.fragmentShader = shader.fragmentShader.replace(
                "#include <color_fragment>",
                `
                #include <color_fragment>
                vec3 lightDir = normalize(vec3(0.4, 1.0, 0.8));
                float diffuse = max(dot(normalize(vNormal), lightDir), 0.0);
                float ambient = clamp(diffuse * 4.0, 0.5, 1.0);
                diffuse = smoothstep(0.4, 0.55, diffuse);

                float wave = sin(uTime * 0.8) * 0.5 + 0.5;
                vec3 softPink = vec3(1.0, 0.76, 0.83);
                vec3 softPeach = vec3(1.0, 0.86, 0.72);
                vec3 dynamicTint = mix(softPink, softPeach, wave);
                vec3 baseColor = mix(diffuseColor.rgb, dynamicTint, 0.35);

                diffuseColor.rgb = baseColor * (diffuse + ambient);
                `
              );
              allShaders.push(shader);
            };
            object.material.needsUpdate = true;
          }
        });

        const box = new THREE.Box3().setFromObject(bakery);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        camera.position.set(box.max.x + size.x * 1.6, center.y, center.z + size.z * 0.15);
        controls.target.copy(center);
        camera.lookAt(center);
        homeCamPos.copy(camera.position);
        homeTarget.copy(center);
      },
      undefined,
      (err) => console.error("โหลดโมเดลไม่สำเร็จ", err)
    );

    function moveCameraTo(targetObj, type) {
      if (!targetObj) return;
      const targetPos = new THREE.Vector3();
      targetObj.getWorldPosition(targetPos);

      startCam.copy(camera.position);
      startTarget.copy(controls.target);
      endTarget.copy(targetPos);

      if (type === "about") {
        const dir = new THREE.Vector3().subVectors(homeCamPos, homeTarget).normalize();
        endCam.copy(targetPos).add(dir.multiplyScalar(4));
      } else {
        endCam.set(targetPos.x + 2.5, targetPos.y, targetPos.z + 0.4);
      }

      currentPage = type;
      movingCamera = true;
      moveStartTime = performance.now();
      controls.enabled = false;

      document.getElementById("backButton").style.display = "block";
      document.getElementById("nextButton").style.display = (type === "menuCake") ? "block" : "none";
    }

    const raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();

    window.addEventListener("click", (event) => {
      if (!bakery) return;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(bakery.children, true);
      if (!intersects.length) return;

      let clicked = intersects[0].object;
      while (clicked) {
        if (clicked.name === "About_me") {
          moveCameraTo(bakery.getObjectByName("About_me"), "about");
          return;
        }
        if (clicked.name === "BtnMenu") {
          moveCameraTo(bakery.getObjectByName("MenuCake"), "menuCake");
          return;
        }
        if (clicked.name === "BtnPortfolio") {
          window.open("https://wiphadathabpia.github.io/PortfolioBakery/", "_blank");
          return;
        }
        clicked = clicked.parent;
      }
    });

    document.getElementById("backButton").addEventListener("click", () => {
      if (!bakery) return;
      if (currentPage === "menuDonut") {
        moveCameraTo(bakery.getObjectByName("MenuCake"), "menuCake");
        return;
      }
      movingCamera = true;
      startCam.copy(camera.position);
      startTarget.copy(controls.target);
      endCam.copy(homeCamPos);
      endTarget.copy(homeTarget);
      moveStartTime = performance.now();
      currentPage = "home";
      controls.enabled = false;
      document.getElementById("backButton").style.display = "none";
      document.getElementById("nextButton").style.display = "none";
    });

    document.getElementById("nextButton").addEventListener("click", () => {
      if (bakery) moveCameraTo(bakery.getObjectByName("MenuDonut"), "menuDonut");
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate(time) {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();
      shaderTime.value = elapsedTime;

      if (cakeMesh) cakeMesh.rotation.y = elapsedTime * 0.8;
      allShaders.forEach(s => s.uniforms.uTime.value = elapsedTime);

      if (movingCamera) {
        const elapsed = performance.now() - moveStartTime;
        let t = Math.min(elapsed / moveDuration, 1);
        t = t * t * (3 - 2 * t);

        camera.position.lerpVectors(startCam, endCam, t);
        controls.target.lerpVectors(startTarget, endTarget, t);
        camera.lookAt(controls.target);

        if (elapsed >= moveDuration) {
          movingCamera = false;
          controls.enabled = true;
        }
      } else {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
