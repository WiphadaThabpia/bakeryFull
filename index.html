<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bakery 3D</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    /* BACK */
    #backButton {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;

      padding: 12px 20px;
      border: none;
      border-radius: 12px;

      background: white;
      color: #5b3a29;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      display: none;
    }

    /* DONUT */
    #donutButton {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;

      padding: 12px 20px;
      border: none;
      border-radius: 12px;

      background: white;
      color: #5b3a29;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      display: none;
    }

    /* CAKE */
    #cakeButton {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 10;

      padding: 12px 20px;
      border: none;
      border-radius: 12px;

      background: white;
      color: #5b3a29;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      display: none;
    }

    button:hover {
      transform: scale(1.05);
    }
  </style>

  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

  <!-- ORBIT CONTROLS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- GLTF LOADER -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

  <!-- BACK -->
  <button id="backButton">← Back</button>

  <!-- DONUT -->
  <button id="donutButton">🍩 Menu Donut</button>

  <!-- CAKE -->
  <button id="cakeButton">🍰 Menu Cake</button>


<script>

  /* =========================================================
     SCENE
  ========================================================= */

  const scene = new THREE.Scene();

  scene.background = new THREE.Color(0xFFF4E3);


  /* =========================================================
     CAMERA
  ========================================================= */

  const camera = new THREE.PerspectiveCamera(
    50,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );


  /* =========================================================
     RENDERER
  ========================================================= */

  const renderer = new THREE.WebGLRenderer({
    antialias: true
  });

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
  );

  renderer.outputEncoding = THREE.sRGBEncoding;

  document.body.appendChild(renderer.domElement);


  /* =========================================================
     CONTROLS
  ========================================================= */

  const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
  );

  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  controls.minDistance = 5;
  controls.maxDistance = 30;


  /* =========================================================
     LIGHT
  ========================================================= */

  const ambientLight = new THREE.AmbientLight(
    0xffffff,
    0.55
  );

  scene.add(ambientLight);


  const light = new THREE.DirectionalLight(
    0xffffff,
    0.35
  );

  light.position.set(5, 3, 10);

  scene.add(light);


  /* =========================================================
     GLTF LOADER
  ========================================================= */

  const loader = new THREE.GLTFLoader();

  let bakery = null;

  let aboutMe = null;
  let menuCake = null;
  let menuDonut = null;

  let homeCameraPosition = null;
  let homeTarget = null;


  /* =========================================================
     LOAD BAKERY
     
     สำคัญ:
     ไฟล์ต้องชื่อ Bekery.glb
  ========================================================= */

  loader.load(

    './Bekery.glb',

    function(gltf) {

      console.log('Bekery.glb โหลดสำเร็จ');

      bakery = gltf.scene;

      scene.add(bakery);


      /* -----------------------------------------
         หา Object ตามชื่อ
      ----------------------------------------- */

      aboutMe = bakery.getObjectByName('AboutMe');

      menuCake = bakery.getObjectByName('MenuCake');

      menuDonut = bakery.getObjectByName('MenuDonut');


      /* -----------------------------------------
         เช็กชื่อ Object
      ----------------------------------------- */

      console.log('AboutMe:', aboutMe);

      console.log('MenuCake:', menuCake);

      console.log('MenuDonut:', menuDonut);


      /* -----------------------------------------
         คำนวณขนาด Bakery
      ----------------------------------------- */

      const box = new THREE.Box3()
        .setFromObject(bakery);

      const center = new THREE.Vector3();

      box.getCenter(center);

      const size = new THREE.Vector3();

      box.getSize(size);


      /* -----------------------------------------
         HOME CAMERA

         ตรงนี้ใช้แบบเดิมที่เคยทำงาน
      ----------------------------------------- */

      camera.position.set(

        box.max.x + size.x * 1.6,

        center.y,

        center.z + size.z * 0.15

      );


      controls.target.set(

        center.x,
        center.y,
        center.z

      );


      camera.lookAt(
        controls.target
      );

      controls.update();


      /* -----------------------------------------
         จำตำแหน่ง Home
      ----------------------------------------- */

      homeCameraPosition =
        camera.position.clone();

      homeTarget =
        controls.target.clone();


      console.log('Bakery loaded');

      console.log('Size:', size);

      console.log('Center:', center);


      /* -----------------------------------------
         ตรวจปุ่ม 3D
      ----------------------------------------- */

      const btnAboutMe =
        bakery.getObjectByName('BtnAboutMe');

      const btnMenu =
        bakery.getObjectByName('BtnMenu');

      const btnPortfolio =
        bakery.getObjectByName('BtnPortfolio');


      console.log(
        'BtnAboutMe:',
        btnAboutMe
      );

      console.log(
        'BtnMenu:',
        btnMenu
      );

      console.log(
        'BtnPortfolio:',
        btnPortfolio
      );

    },


    /* -----------------------------------------
       Loading Progress
    ----------------------------------------- */

    function(xhr) {

      if (xhr.total > 0) {

        console.log(

          'Loading:',
          (
            xhr.loaded /
            xhr.total *
            100
          ).toFixed(0) + '%'

        );

      }

    },


    /* -----------------------------------------
       ERROR
    ----------------------------------------- */

    function(error) {

      console.error(
        'โหลด Bekery.glb ไม่สำเร็จ',
        error
      );

    }

  );


  /* =========================================================
     CAMERA FUNCTION
  ========================================================= */

  function moveCameraToObject(object) {

    if (!object) {

      console.warn(
        'ไม่พบ Object สำหรับกล้อง'
      );

      return;

    }


    const box = new THREE.Box3()
      .setFromObject(object);


    const center = new THREE.Vector3();

    box.getCenter(center);


    const size = new THREE.Vector3();

    box.getSize(size);


    const maxSize =
      Math.max(
        size.x,
        size.y,
        size.z
      );


    const distance =
      maxSize * 3;


    camera.position.set(

      center.x + distance,

      center.y,

      center.z

    );


    controls.target.copy(center);

    camera.lookAt(center);

    controls.update();

  }


  /* =========================================================
     ABOUT ME
  ========================================================= */

  function goToAboutMe() {

    if (!aboutMe) {

      console.warn(
        'ยังไม่พบ Object ชื่อ AboutMe'
      );

      return;

    }

    moveCameraToObject(
      aboutMe
    );

    document.getElementById(
      'backButton'
    ).style.display = 'block';

  }


  /* =========================================================
     MENU CAKE
     
     ไม่เปลี่ยนแนวเดิม:
     ใช้ MenuCake
  ========================================================= */

  function goToMenuCake() {

    if (!menuCake) {

      console.warn(
        'ยังไม่พบ Object ชื่อ MenuCake'
      );

      return;

    }


    const box = new THREE.Box3()
      .setFromObject(menuCake);

    const center = new THREE.Vector3();

    box.getCenter(center);

    const size = new THREE.Vector3();

    box.getSize(size);


    const distance =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 3;


    /* -----------------------------------------
       MenuCake
       ใช้มุมด้านหน้า +X
       ----------------------------------------- */

    camera.position.set(

      center.x + distance,

      center.y,

      center.z

    );


    controls.target.copy(center);

    camera.lookAt(center);

    controls.update();


    document.getElementById(
      'backButton'
    ).style.display = 'block';

    document.getElementById(
      'donutButton'
    ).style.display = 'block';

    document.getElementById(
      'cakeButton'
    ).style.display = 'none';

  }


  /* =========================================================
     MENU DONUT
  ========================================================= */

  function goToMenuDonut() {

    if (!menuDonut) {

      console.warn(
        'ยังไม่พบ Object ชื่อ MenuDonut'
      );

      return;

    }


    const box = new THREE.Box3()
      .setFromObject(menuDonut);

    const center = new THREE.Vector3();

    box.getCenter(center);

    const size = new THREE.Vector3();

    box.getSize(size);


    const distance =
      Math.max(
        size.x,
        size.y,
        size.z
      ) * 3;


    /* -----------------------------------------
       Donut อยู่ด้านข้าง
       ----------------------------------------- */

    camera.position.set(

      center.x,

      center.y - distance,

      center.z

    );


    controls.target.copy(center);

    camera.lookAt(center);

    controls.update();


    document.getElementById(
      'backButton'
    ).style.display = 'block';

    document.getElementById(
      'donutButton'
    ).style.display = 'none';

    document.getElementById(
      'cakeButton'
    ).style.display = 'block';

  }


  /* =========================================================
     BACK HOME
  ========================================================= */

  document.getElementById(
    'backButton'
  ).addEventListener(
    'click',
    function() {

      if (!homeCameraPosition) {
        return;
      }


      camera.position.copy(
        homeCameraPosition
      );

      controls.target.copy(
        homeTarget
      );

      camera.lookAt(
        controls.target
      );

      controls.update();


      document.getElementById(
        'backButton'
      ).style.display = 'none';

      document.getElementById(
        'donutButton'
      ).style.display = 'none';

      document.getElementById(
        'cakeButton'
      ).style.display = 'none';

    }
  );


  /* =========================================================
     DONUT HTML BUTTON
  ========================================================= */

  document.getElementById(
    'donutButton'
  ).addEventListener(
    'click',
    function() {

      goToMenuDonut();

    }
  );


  /* =========================================================
     CAKE HTML BUTTON
  ========================================================= */

  document.getElementById(
    'cakeButton'
  ).addEventListener(
    'click',
    function() {

      goToMenuCake();

    }
  );


  /* =========================================================
     3D BUTTON CLICK
  ========================================================= */

  const raycaster =
    new THREE.Raycaster();

  const mouse =
    new THREE.Vector2();


  renderer.domElement.addEventListener(
    'click',
    function(event) {

      mouse.x =
        (event.clientX /
        window.innerWidth) * 2 - 1;

      mouse.y =
        -(event.clientY /
        window.innerHeight) * 2 + 1;


      raycaster.setFromCamera(
        mouse,
        camera
      );


      if (!bakery) {
        return;
      }


      const objects = [];


      bakery.traverse(
        function(child) {

          if (child.isMesh) {

            objects.push(child);

          }

        }
      );


      const hits =
        raycaster.intersectObjects(
          objects,
          true
        );


      if (hits.length === 0) {
        return;
      }


      let clicked =
        hits[0].object;


      /* -----------------------------------------
         หา Parent ที่ชื่อปุ่ม
      ----------------------------------------- */

      while (
        clicked &&
        clicked !== bakery
      ) {

        if (
          clicked.name ===
          'BtnAboutMe'
        ) {

          goToAboutMe();

          return;

        }


        if (
          clicked.name ===
          'BtnMenu'
        ) {

          goToMenuCake();

          return;

        }


        if (
          clicked.name ===
          'BtnPortfolio'
        ) {

          window.location.href =
            'https://example.com';

          return;

        }


        clicked =
          clicked.parent;

      }

    }
  );


  /* =========================================================
     RESIZE
  ========================================================= */

  window.addEventListener(
    'resize',
    function() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();


      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );


      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio,
          2
        )
      );

    }
  );


  /* =========================================================
     ANIMATION
  ========================================================= */

  function animate() {

    requestAnimationFrame(
      animate
    );

    controls.update();

    renderer.render(
      scene,
      camera
    );

  }

  animate();

</script>

</body>
</html>
