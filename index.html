```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bakery 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:sans-serif;background:#FFF4E3}
canvas{display:block}
#backButton,#nextButton{position:fixed;z-index:10;padding:12px 20px;border:none;border-radius:10px;background:white;color:#8b5362;font-size:16px;font-weight:bold;cursor:pointer;box-shadow:0 3px 10px #0002;display:none}
#backButton{left:20px;top:20px}
#nextButton{right:20px;bottom:20px}
#backButton:hover,#nextButton:hover{background:#ffe5ec}
</style>
</head>
<body>
<button id="backButton">← Back</button>
<button id="nextButton">Next →</button>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xFFF4E3);

const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.05;
controls.minDistance=5;
controls.maxDistance=30;

const ambient=new THREE.AmbientLight(0xffffff,0.45);
scene.add(ambient);

const mainLight=new THREE.SpotLight(0xffffff,2.5);
mainLight.position.set(8,10,12);
mainLight.angle=Math.PI/5;
mainLight.penumbra=0.4;
mainLight.castShadow=true;
scene.add(mainLight);

const leftLight=new THREE.SpotLight(0xffffff,1.5);
leftLight.position.set(-8,6,8);
leftLight.angle=Math.PI/4;
leftLight.penumbra=0.5;
scene.add(leftLight);

const backLight=new THREE.DirectionalLight(0xffffff,0.5);
backLight.position.set(-5,-5,8);
scene.add(backLight);

const loader=new THREE.GLTFLoader();
let bakery;
let homeCameraPosition=new THREE.Vector3();
let homeTarget=new THREE.Vector3();
let currentPage="home";
let moving=false;

const backButton=document.getElementById("backButton");
const nextButton=document.getElementById("nextButton");

loader.load("Bekery.glb",function(gltf){
    bakery=gltf.scene;
    scene.add(bakery);

    bakery.traverse(function(obj){
        if(obj.isMesh){
            obj.castShadow=true;
            obj.receiveShadow=true;
        }
    });

    const box=new THREE.Box3().setFromObject(bakery);
    const center=box.getCenter(new THREE.Vector3());
    const size=box.getSize(new THREE.Vector3());

    // มุมกล้องเริ่มต้นเดิม
    camera.position.set(
        box.max.x+size.x*1.6,
        center.y,
        center.z+size.z*0.15
    );

    controls.target.copy(center);

    homeCameraPosition.copy(camera.position);
    homeTarget.copy(controls.target);
});

function findObject(name){
    if(!bakery)return null;
    let result=null;
    bakery.traverse(function(obj){
        if(obj.name===name)result=obj;
    });
    return result;
}

/* กล้องสำหรับ About Me
   ให้กล้องอยู่ด้านหน้าป้ายและหันเข้าหาป้าย */
function moveToAbout(){
    const target=findObject("Aboutme.001");
    if(!target){
        console.log("หา Aboutme.001 ไม่เจอ");
        return;
    }

    const targetPosition=new THREE.Vector3();
    target.getWorldPosition(targetPosition);

    const box=new THREE.Box3().setFromObject(target);
    const size=box.getSize(new THREE.Vector3());

    // วางกล้องด้านหน้าป้าย
    const cameraPosition=new THREE.Vector3(
        targetPosition.x+size.x*2.5,
        targetPosition.y+size.y*0.3,
        targetPosition.z+size.z*0.3
    );

    animateCamera(cameraPosition,targetPosition);
}

/* กล้อง Menu
   ใช้มุมเดิมของตำแหน่ง Menu ไม่หมุนเพิ่ม */
function moveToMenu(name){
    const target=findObject(name);
    if(!target){
        console.log("หา "+name+" ไม่เจอ");
        return;
    }

    const targetPosition=new THREE.Vector3();
    target.getWorldPosition(targetPosition);

    const currentDirection=new THREE.Vector3();
    camera.getWorldDirection(currentDirection);

    // ใช้ทิศทางกล้องเดิม
    const distance=6;
    const cameraPosition=targetPosition.clone().sub(
        currentDirection.multiplyScalar(distance)
    );

    animateCamera(cameraPosition,targetPosition);
}

function animateCamera(endPosition,endTarget){
    const startPosition=camera.position.clone();
    const startTarget=controls.target.clone();

    moving=true;

    const startTime=performance.now();
    const duration=1000;

    function animation(time){
        const t=Math.min((time-startTime)/duration,1);
        const smooth=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

        camera.position.lerpVectors(
            startPosition,
            endPosition,
            smooth
        );

        controls.target.lerpVectors(
            startTarget,
            endTarget,
            smooth
        );

        controls.update();

        if(t<1){
            requestAnimationFrame(animation);
        }else{
            moving=false;
        }
    }

    requestAnimationFrame(animation);
}

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

renderer.domElement.addEventListener("click",function(event){
    if(!bakery||moving)return;

    mouse.x=(event.clientX/innerWidth)*2-1;
    mouse.y=-(event.clientY/innerHeight)*2+1;

    raycaster.setFromCamera(mouse,camera);

    const hits=raycaster.intersectObject(bakery,true);

    if(hits.length===0)return;

    let obj=hits[0].object;

    console.log("กดโดน:",obj.name);

    while(obj){

        console.log("กำลังตรวจ:",obj.name);

        // ABOUT ME
        if(
            obj.name==="BtnAboutme.002"||
            obj.name.toLowerCase().includes("about")
        ){
            console.log("เจอ ABOUT ME");

            currentPage="about";
            moveToAbout();

            backButton.style.display="block";
            nextButton.style.display="none";

            return;
        }

        // MENU
        if(
            obj.name==="BtnMenu"||
            obj.name.toLowerCase()==="menu"
        ){
            console.log("เจอ MENU");

            currentPage="menuCake";
            moveToMenu("MenuCake");

            backButton.style.display="block";
            nextButton.style.display="block";

            return;
        }

        // PORTFOLIO
        if(
            obj.name==="BtnPortfolio"||
            obj.name.toLowerCase().includes("portfolio")
        ){
            console.log("เจอ PORTFOLIO");

            window.open("https://example.com","_blank");
            return;
        }

        obj=obj.parent;
    }
});

backButton.addEventListener("click",function(){
    if(moving)return;

    // MenuDonut → MenuCake
    if(currentPage==="menuDonut"){
        currentPage="menuCake";
        moveToMenu("MenuCake");
        nextButton.style.display="block";
        return;
    }

    // กลับหน้าร้าน
    currentPage="home";

    camera.position.copy(homeCameraPosition);
    controls.target.copy(homeTarget);
    controls.update();

    backButton.style.display="none";
    nextButton.style.display="none";
});

nextButton.addEventListener("click",function(){
    if(moving)return;

    if(currentPage==="menuCake"){
        currentPage="menuDonut";

        moveToMenu("MenuDonut");

        nextButton.style.display="none";
    }
});

window.addEventListener("resize",function(){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
}

animate();
</script>
</body>
</html>
```
