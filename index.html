<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bakery 3D - Custom Shader</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; background: #FFF4E3; }
    canvas { display: block; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  // Scene / Camera / Renderer
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFFF4E3);

  const camera = new THREE.PerspectiveCamera(
    45,
    innerWidth / innerHeight,
    0.1,
    1000
  );

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Uniforms สำหรับส่งค่าเวลาเข้า Shader
  const uniforms = {
    uTime: { value: 0.0 },
    uLightDir: { value: new THREE.Vector3(0.4, 1.0, 0.8).normalize() }
  };

  // Vertex Shader สำหรับหมุนรอบแกน Y (Cylinder.024)
  const cakeVertexShader = `
    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {
      vUv = uv;
      vNormal = normal;

      vec3 pos = position;

      // ความเร็วและมุมในการหมุนรอบแกน Y
      float angle = uTime * 0.8;
      float c = cos(angle);
      float s = sin(angle);
      mat2 rot = mat2(c, -s, s, c);

      // หมุนตำแหน่ง X และ Z ของ Vertex
      pos.xz = rot * pos.xz;

      gl_Position = projectionMatrix * viewMatrix * modelMatrix * vec4(pos, 1.0);
    }
  `;

  // Fragment Shader สำหรับสลับเฉดสี ชมพู - พีช
  const cakeFragmentShader = `
    precision mediump float;

    uniform float uTime;
    varying vec2 vUv;
    varying vec3 vNormal;

    void main() {
      // สร้างจังหวะการเปลี่ยนสีด้วย sin
      float colorPulse = 0.5 + 0.5 * sin(uTime * 1.0);

      vec3 pinkTint = vec3(1.00, 0.18, 0.48);
      vec3 orangeTint = vec3(1.00, 0.68, 0.16);
      vec3 baseColor = mix(pinkTint, orangeTint, colorPulse);

      // แสงเงาเบื้องต้น (Lambert diffuse)
      vec3 N = normalize(vNormal);
      vec3 L = normalize(vec3(0.4, 1.0, 0.8));
      float diffuse = max(dot(N, L), 0.0);
      float ambient = clamp(diffuse * 4.0, 0.4, 1.0);

      vec3 finalColor = baseColor * ambient;
      gl_FragColor = vec4(finalColor, 1.0);
    }
  `;

  const cakeMaterial = new THREE.ShaderMaterial({
    vertexShader: cakeVertexShader,
    fragmentShader: cakeFragmentShader,
    uniforms: uniforms,
    side: THREE.DoubleSide
  });

  // โหลดโมเดล Bakery.glb
  const loader = new THREE.GLTFLoader();
  let bakery = null;

  loader.load('Bekery.glb', function(gltf) {
    bakery = gltf.scene;
    scene.add(bakery);

    bakery.traverse(function(node) {
      if (node.isMesh) {
        node.castShadow = true;
        node.receiveShadow = true;

        // แทนที่ Material ของก้อนเค้กชิ้นใหญ่ (Cylinder.024) ด้วย Shader ของเรา
        if (node.name === "Cylinder.024") {
          node.material = cakeMaterial;
          console.log("Applied custom shader to Cylinder.024");
        }
      }
    });

    // ตั้งค่ากล้องให้มองมาที่โมเดล
    const box = new THREE.Box3().setFromObject(bakery);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    camera.position.set(box.max.x + size.x * 1.6, center.y, center.z + size.z * 0.15);
    controls.target.copy(center);
    controls.update();
  });

  // ปรับขนาดหน้าจออัตโนมัติ
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  // ลูปการทำงาน (Animation Loop)
  function animate(time) {
    requestAnimationFrame(animate);

    // อัปเดตเวลาให้ Shader
    uniforms.uTime.value = time * 0.001;

    controls.update();
    renderer.render(scene, camera);
  }

  requestAnimationFrame(animate);
</script>
</body>
</html>
