<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakery 3D</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFF4E3;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    #backButton,
    #nextButton {
      position: fixed;
      z-index: 10;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #5a3a2e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      display: none;
    }

    #backButton {
      left: 20px;
      top: 20px;
    }

    #nextButton {
      right: 20px;
      bottom: 20px;
    }

    #backButton:hover,
    #nextButton:hover {
      transform: scale(1.05);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

  <button id="backButton">← กลับ</button>
  <button id="nextButton">Menu Donut →</button>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xFFF4E3);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
    scene.add(ambientLight);

    const mainLight = new THREE.SpotLight(0xffffff, 2.5);
    mainLight.position.set(8, 10, 12);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const leftLight = new THREE.SpotLight(0xffffff, 1.5);
    leftLight.position.set(-8, 6, 8);
    scene.add(leftLight);

    const backLight = new THREE.DirectionalLight(0xffffff, 0.5);
    backLight.position.set(-5, -5, 8);
    scene.add(backLight);

    const clock = new THREE.Clock();
    const shaderTime = { value: 0.0 };
    const cakeShaders = [];
    let targetMesh = null;

    const homeCameraPosition = new THREE.Vector3();
    const homeTarget = new THREE.Vector3();
    let currentPage = "home";
    let movingCamera = false;
    let moveStartTime = 0;
    const startCamera = new THREE.Vector3();
    const endCamera = new THREE.Vector3();
    const startTarget = new THREE.Vector3();
    const endTarget = new THREE.Vector3();
    const moveDuration = 1000;

    const loader = new THREE.GLTFLoader();
    loader.load(
      "Bekery.glb",
      function(gltf) {
        bakery = gltf.scene;
        scene.add(bakery);

        bakery.traverse(function(object) {
          if (object.isMesh) {
            object.castShadow = true;
            object.receiveShadow = true;

            // ค้นหาก้อนเค้กจากชื่อ
            if (object.name === "Cylinder.024" || object.name.includes("Cylinder")) {
              targetMesh = object;
              object.material = object.material.clone();

              object.material.onBeforeCompile = function(shader) {
                shader.uniforms.uTime = shaderTime;

                shader.fragmentShader = `
                  uniform float uTime;
                ` + shader.fragmentShader;

                shader.fragmentShader = shader.fragmentShader.replace(
                  "#include <color_fragment>",
                  `
                  #include <color_fragment>

                  float colorPulse = 0.5 + 0.5 * sin(uTime * 1.0);
                  vec3 pinkTint = vec3(1.00, 0.18, 0.48);
                  vec3 orangeTint = vec3(1.00, 0.68, 0.16);
                  vec3 newTint = mix(pinkTint, orangeTint, colorPulse);

                  diffuseColor.rgb = mix(diffuseColor.rgb, newTint, 0.4);
                  `
                );

                cakeShaders.push(shader);
              };

              object.material.side = THREE.DoubleSide;
              object.material.needsUpdate = true;
            }
          }
        });

        const box = new THREE.Box3().setFromObject(bakery);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        camera.position.set(
          box.max.x + size.x * 1.6,
          center.y,
          center.z + size.z * 0.15
        );
        controls.target.copy(center);
        controls.update();

        homeCameraPosition.copy(camera.position);
        homeTarget.copy(controls.target);
      },
      undefined,
      function(error) {
        console.error("โหลด Bakery ไม่สำเร็จ", error);
      }
    );

    function moveCameraTo(targetObject, type) {
      if (!targetObject) return;
      const targetPosition = new THREE.Vector3();
      targetObject.getWorldPosition(targetPosition);

      startCamera.copy(camera.position);
      startTarget.copy(controls.target);
      endTarget.copy(targetPosition);

      if (type === "about") {
        const direction = new THREE.Vector3().subVectors(homeCameraPosition, homeTarget).normalize();
        endCamera.copy(targetPosition).add(direction.multiplyScalar(4));
        currentPage = "about";
      } else if (type === "menuCake") {
        endCamera.set(targetPosition.x + 2.5, targetPosition.y, targetPosition.z + 0.4);
        currentPage = "menuCake";
      } else if (type === "menuDonut") {
        endCamera.set(targetPosition.x + 2.5, targetPosition.y, targetPosition.z + 0.4);
        currentPage = "menuDonut";
      }

      movingCamera = true;
      moveStartTime = performance.now();
      controls.enabled = false;
      document.getElementById("backButton").style.display = "block";
      document.getElementById("nextButton").style.display = (type === "menuCake") ? "block" : "none";
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener("click", function(event) {
      if (!bakery) return;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(bakery.children, true);
      if (intersects.length === 0) return;

      let clicked = intersects[0].object;
      while (clicked) {
        if (clicked.name === "About_me") {
          moveCameraTo(bakery.getObjectByName("About_me"), "about");
          return;
        }
        if (clicked.name === "BtnMenu") {
          moveCameraTo(bakery.getObjectByName("MenuCake"), "menuCake");
          return;
        }
        if (clicked.name === "BtnPortfolio") {
          window.open("https://wiphadathabpia.github.io/PortfolioBakery/", "_blank");
          return;
        }
        clicked = clicked.parent;
      }
    });

    document.getElementById("backButton").addEventListener("click", function() {
      if (!bakery) return;
      if (currentPage === "menuDonut") {
        moveCameraTo(bakery.getObjectByName("MenuCake"), "menuCake");
        return;
      }
      movingCamera = true;
      startCamera.copy(camera.position);
      startTarget.copy(controls.target);
      endCamera.copy(homeCameraPosition);
      endTarget.copy(homeTarget);
      moveStartTime = performance.now();
      currentPage = "home";
      controls.enabled = false;
      document.getElementById("backButton").style.display = "none";
      document.getElementById("nextButton").style.display = "none";
    });

    document.getElementById("nextButton").addEventListener("click", function() {
      if (!bakery) return;
      moveCameraTo(bakery.getObjectByName("MenuDonut"), "menuDonut");
    });

    window.addEventListener("resize", function() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);

      const currentTime = clock.getElapsedTime();
      shaderTime.value = currentTime;

      if (targetMesh) {
        targetMesh.rotation.y = currentTime * 0.8;
      }

      cakeShaders.forEach(function(shader) {
        shader.uniforms.uTime.value = currentTime;
      });

      if (movingCamera) {
        const elapsed = performance.now() - moveStartTime;
        let p = Math.min(elapsed / moveDuration, 1);
        p = p * p * (3 - 2 * p);
        camera.position.lerpVectors(startCamera, endCamera, p);
        controls.target.lerpVectors(startTarget, endTarget, p);
        camera.lookAt(controls.target);
        if (elapsed >= moveDuration) {
          movingCamera = false;
          controls.enabled = true;
        }
      } else {
        controls.update();
      }

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
