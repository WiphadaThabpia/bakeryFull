<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery Portfolio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #f6eee5;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    button {
      position: fixed;
      z-index: 10;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #fff;
      color: #5b3824;
      box-shadow: 0 4px 12px rgba(0,0,0,.18);
      transition: .2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #backButton {
      top: 20px;
      left: 20px;
    }

    #cakeButton {
      bottom: 20px;
      left: 20px;
    }

    #donutButton {
      bottom: 20px;
      right: 20px;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 8px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,.9);
      color: #5b3824;
      font-size: 13px;
      display: none;
    }
  </style>
</head>

<body>

  <button id="backButton">← Back</button>
  <button id="cakeButton">Cake</button>
  <button id="donutButton">Donut</button>

  <div id="status"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">

    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // =========================
    // SCENE
    // =========================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf6eee5);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    document.body.appendChild(renderer.domElement);


    // =========================
    // LIGHT
    // =========================

    const ambientLight = new THREE.HemisphereLight(
      0xffffff,
      0x8b6b55,
      2.5
    );

    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(
      0xffffff,
      3
    );

    mainLight.position.set(5, 10, 8);
    mainLight.castShadow = true;

    scene.add(mainLight);


    // =========================
    // CONTROLS
    // =========================

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 2;
    controls.maxDistance = 30;


    // =========================
    // VARIABLES
    // =========================

    let model;

    let btnAboutMe;
    let btnMenu;
    let btnPortfolio;

    let aboutMeTarget;
    let menuCakeTarget;
    let menuDonutTarget;

    let currentTarget = null;

    let isFlying = false;

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();


    // =========================
    // FIND OBJECT
    // =========================

    function findObject(root, name) {

      let result = null;

      root.traverse((node) => {

        if (
          node.name &&
          node.name.trim().toLowerCase() ===
          name.trim().toLowerCase()
        ) {
          if (!result) {
            result = node;
          }
        }

      });

      return result;
    }


    // =========================
    // LOAD MODEL
    // =========================

    const loader = new GLTFLoader();

    loader.load(

      './Bekery.glb',

      (gltf) => {

        model = gltf.scene;

        scene.add(model);

        // Shadows
        model.traverse((node) => {

          if (node.isMesh) {

            node.castShadow = true;
            node.receiveShadow = true;

          }

        });


        // =========================
        // FIND BUTTONS / TARGETS
        // =========================

        btnAboutMe =
          findObject(model, 'BtnAboutme.002');

        btnMenu =
          findObject(model, 'BtnMenu');

        btnPortfolio =
          findObject(model, 'BtnPortfolio');

        aboutMeTarget =
          findObject(model, 'Aboutme.001');

        menuCakeTarget =
          findObject(model, 'MenuCake');

        menuDonutTarget =
          findObject(model, 'MenuDonut');


        console.log('BtnAboutme.002:', btnAboutMe);
        console.log('Aboutme.001:', aboutMeTarget);
        console.log('BtnMenu:', btnMenu);
        console.log('BtnPortfolio:', btnPortfolio);
        console.log('MenuCake:', menuCakeTarget);
        console.log('MenuDonut:', menuDonutTarget);


        // =========================
        // HOME CAMERA
        // =========================

        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        camera.position.set(
          box.max.x + size.x * 1.6,
          center.y,
          center.z + size.z * 0.15
        );

        controls.target.set(
          center.x,
          center.y,
          center.z
        );

        camera.lookAt(controls.target);
        controls.update();

        currentTarget = null;

        console.log('===== MODEL LOADED =====');

      },

      (progress) => {

        if (progress.total) {

          console.log(
            'Loading:',
            Math.round(
              progress.loaded / progress.total * 100
            ) + '%'
          );

        }

      },

      (error) => {

        console.error(
          'GLB LOAD ERROR:',
          error
        );

        showStatus(
          'โหลด Bekery.glb ไม่สำเร็จ'
        );

      }

    );


    // =========================
    // CAMERA FLY
    // =========================

    function flyCameraTo(targetObject) {

      if (!targetObject || isFlying) return;

      isFlying = true;

      const box =
        new THREE.Box3()
          .setFromObject(targetObject);

      const center =
        box.getCenter(
          new THREE.Vector3()
        );

      const size =
        box.getSize(
          new THREE.Vector3()
        );

      const startPosition =
        camera.position.clone();

      const startTarget =
        controls.target.clone();

      const direction =
        new THREE.Vector3()
          .subVectors(
            camera.position,
            controls.target
          )
          .normalize();

      const distance =
        Math.max(
          size.x,
          size.y,
          size.z,
          1
        ) * 4;

      const endPosition =
        center.clone()
          .add(
            direction.multiplyScalar(distance)
          );

      const endTarget =
        center.clone();

      const duration = 1000;

      const startTime =
        performance.now();


      function animateCamera(time) {

        const progress =
          Math.min(
            (time - startTime) / duration,
            1
          );

        const eased =
          1 - Math.pow(1 - progress, 3);

        camera.position.lerpVectors(
          startPosition,
          endPosition,
          eased
        );

        controls.target.lerpVectors(
          startTarget,
          endTarget,
          eased
        );

        camera.lookAt(
          controls.target
        );

        controls.update();

        if (progress < 1) {

          requestAnimationFrame(
            animateCamera
          );

        } else {

          isFlying = false;
          currentTarget = targetObject;

        }

      }

      requestAnimationFrame(
        animateCamera
      );

    }


    // =========================
    // SHOW ABOUT
    // =========================

    function showAboutMe() {

      if (!aboutMeTarget) {
        console.warn(
          'Aboutme.001 not found'
        );
        return;
      }

      flyCameraTo(
        aboutMeTarget
      );

    }


    // =========================
    // SHOW MENU
    // =========================

    function showMenu() {

      if (!menuCakeTarget) {
        console.warn(
          'MenuCake not found'
        );
        return;
      }

      flyCameraTo(
        menuCakeTarget
      );

    }


    // =========================
    // SHOW CAKE
    // =========================

    function showCake() {

      if (!menuCakeTarget) return;

      flyCameraTo(
        menuCakeTarget
      );

    }


    // =========================
    // SHOW DONUT
    // =========================

    function showDonut() {

      if (!menuDonutTarget) return;

      flyCameraTo(
        menuDonutTarget
      );

    }


    // =========================
    // BACK HOME
    // =========================

    function goBack() {

      if (!model || isFlying) return;

      const box =
        new THREE.Box3()
          .setFromObject(model);

      const center =
        box.getCenter(
          new THREE.Vector3()
        );

      const size =
        box.getSize(
          new THREE.Vector3()
        );

      const startPosition =
        camera.position.clone();

      const startTarget =
        controls.target.clone();

      const endPosition =
        new THREE.Vector3(
          box.max.x + size.x * 1.6,
          center.y,
          center.z + size.z * 0.15
        );

      const endTarget =
        center.clone();

      const duration = 1000;

      const startTime =
        performance.now();

      isFlying = true;

      function animateBack(time) {

        const progress =
          Math.min(
            (time - startTime) / duration,
            1
          );

        const eased =
          1 - Math.pow(1 - progress, 3);

        camera.position.lerpVectors(
          startPosition,
          endPosition,
          eased
        );

        controls.target.lerpVectors(
          startTarget,
          endTarget,
          eased
        );

        camera.lookAt(
          controls.target
        );

        controls.update();

        if (progress < 1) {

          requestAnimationFrame(
            animateBack
          );

        } else {

          isFlying = false;
          currentTarget = null;

        }

      }

      requestAnimationFrame(
        animateBack
      );

    }


    // =========================
    // CLICK 3D OBJECT
    // =========================

    function isObjectOrChild(
      object,
      target
    ) {

      let current = object;

      while (current) {

        if (current === target) {
          return true;
        }

        current = current.parent;

      }

      return false;

    }


    renderer.domElement.addEventListener(
      'pointerdown',
      (event) => {

        if (!model || isFlying) return;

        mouse.x =
          (event.clientX /
            window.innerWidth) * 2 - 1;

        mouse.y =
          -(event.clientY /
            window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(
          mouse,
          camera
        );

        const intersects =
          raycaster.intersectObject(
            model,
            true
          );

        if (!intersects.length) {
          return;
        }

        const clicked =
          intersects[0].object;


        // About Me
        if (
          btnAboutMe &&
          isObjectOrChild(
            clicked,
            btnAboutMe
          )
        ) {

          showAboutMe();
          return;

        }


        // Menu
        if (
          btnMenu &&
          isObjectOrChild(
            clicked,
            btnMenu
          )
        ) {

          showMenu();
          return;

        }


        // Portfolio
        if (
          btnPortfolio &&
          isObjectOrChild(
            clicked,
            btnPortfolio
          )
        ) {

          window.open(
            'https://example.com',
            '_blank'
          );

          return;

        }

      }
    );


    // =========================
    // HTML BUTTONS
    // =========================

    document
      .getElementById('cakeButton')
      .addEventListener(
        'click',
        showCake
      );


    document
      .getElementById('donutButton')
      .addEventListener(
        'click',
        showDonut
      );


    document
      .getElementById('backButton')
      .addEventListener(
        'click',
        goBack
      );


    // =========================
    // STATUS
    // =========================

    function showStatus(text) {

      const status =
        document.getElementById(
          'status'
        );

      status.textContent = text;
      status.style.display = 'block';

      setTimeout(() => {

        status.style.display = 'none';

      }, 2500);

    }


    // =========================
    // RESIZE
    // =========================

    window.addEventListener(
      'resize',
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    // =========================
    // ANIMATE
    // =========================

    function animate() {

      requestAnimationFrame(
        animate
      );

      controls.update();

      renderer.render(
        scene,
        camera
      );

    }

    animate();

  </script>

</body>
</html>
