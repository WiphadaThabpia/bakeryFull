<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bakery 3D</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFF4E3;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    #backButton,
    #nextButton {
      position: fixed;
      z-index: 10;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: white;
      color: #5a3a2e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      display: none;
    }

    #backButton {
      left: 20px;
      top: 20px;
    }

    #nextButton {
      right: 20px;
      bottom: 20px;
    }

    #backButton:hover,
    #nextButton:hover {
      transform: scale(1.05);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>

<body>

  <button id="backButton">← กลับ</button>
  <button id="nextButton">Menu Donut →</button>

  <script>
    /* =========================
        SCENE
    ========================= */

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xFFF4E3);


    /* =========================
        CAMERA
    ========================= */

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );


    /* =========================
        RENDERER
    ========================= */

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;

    document.body.appendChild(renderer.domElement);


    /* =========================
        CONTROLS
    ========================= */

    const controls = new THREE.OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 30;


    /* =========================
        LIGHT
    ========================= */

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      0.45
    );

    scene.add(ambientLight);


    const mainLight = new THREE.SpotLight(
      0xffffff,
      2.5
    );

    mainLight.position.set(8, 10, 12);
    mainLight.castShadow = true;

    scene.add(mainLight);


    const leftLight = new THREE.SpotLight(
      0xffffff,
      1.5
    );

    leftLight.position.set(-8, 6, 8);

    scene.add(leftLight);


    const backLight = new THREE.DirectionalLight(
      0xffffff,
      0.5
    );

    backLight.position.set(-5, -5, 8);

    scene.add(backLight);


    /* =========================
        ANIMATION VARIABLES
    ========================= */

    const clock = new THREE.Clock();
    let clothMesh = null;
    let originalPositions = null;
    let clothMinY = 0;
    let clothMaxY = 0;


    /* =========================
        CAMERA VARIABLES
    ========================= */

    const homeCameraPosition = new THREE.Vector3();
    const homeTarget = new THREE.Vector3();

    let currentPage = "home";
    let movingCamera = false;
    let moveStartTime = 0;

    const startCamera = new THREE.Vector3();
    const endCamera = new THREE.Vector3();

    const startTarget = new THREE.Vector3();
    const endTarget = new THREE.Vector3();

    const moveDuration = 1000;


    /* =========================
        LOAD GLB
    ========================= */

    const loader = new THREE.GLTFLoader();

    let bakery = null;

    loader.load(
      "Bekery.glb",

      function(gltf) {

        bakery = gltf.scene;

        scene.add(bakery);


        /* =========================
            SHADOW
        ========================= */

        bakery.traverse(function(object) {

          if (object.isMesh) {
            object.castShadow = true;
            object.receiveShadow = true;
          }

        });


        /* =========================
            PLANE.001 (CLOTH) SETUP
        ========================= */

        bakery.traverse(function(node) {

          if (node.name === "Plane.001" && node.isMesh && node.geometry) {

            clothMesh = node;
            
            // Clone geometry เพื่อไม่ให้กระทบชิ้นอื่น
            clothMesh.geometry = node.geometry.clone();
            const geometry = clothMesh.geometry;

            geometry.computeBoundingBox();
            clothMinY = geometry.boundingBox.min.y;
            clothMaxY = geometry.boundingBox.max.y;

            // บันทึกตำแหน่งตั้งต้นของ Vertex ทุกตัว
            const positionAttribute = geometry.attributes.position;
            originalPositions = new Float32Array(positionAttribute.array);

            // ตั้งค่า Material ให้แสดงผลสองด้าน
            if (node.material) {
              node.material = node.material.clone();
              node.material.side = THREE.DoubleSide;
              node.material.needsUpdate = true;
            }

            console.log("Found Plane.001 for JS Animation, vertices count:", positionAttribute.count);
          }

        });


        /* =========================
            MODEL SIZE
        ========================= */

        const box = new THREE.Box3()
          .setFromObject(bakery);

        const size = box.getSize(
          new THREE.Vector3()
        );

        const center = box.getCenter(
          new THREE.Vector3()
        );


        /* =========================
            HOME CAMERA
        ========================= */

        camera.position.set(
          box.max.x + size.x * 1.6,
          center.y,
          center.z + size.z * 0.15
        );

        controls.target.set(
          center.x,
          center.y,
          center.z
        );

        camera.lookAt(controls.target);


        /* =========================
            SAVE HOME CAMERA
        ========================= */

        homeCameraPosition.copy(camera.position);
        homeTarget.copy(controls.target);

      },

      undefined,

      function(error) {

        console.error("โหลด Bakery ไม่สำเร็จ", error);

      }
    );


    /* =========================
        MOVE CAMERA
    ========================= */

    function moveCameraTo(targetObject, type) {

      if (!targetObject) {
        return;
      }

      const targetPosition = new THREE.Vector3();
      targetObject.getWorldPosition(targetPosition);

      startCamera.copy(camera.position);
      startTarget.copy(controls.target);
      endTarget.copy(targetPosition);

      if (type === "about") {
        const direction = new THREE.Vector3()
          .subVectors(homeCameraPosition, homeTarget)
          .normalize();
        endCamera.copy(targetPosition);
        endCamera.add(direction.multiplyScalar(4));
        currentPage = "about";
      } else if (type === "menuCake") {
        endCamera.set(
          targetPosition.x + 2.5,
          targetPosition.y,
          targetPosition.z + 0.4
        );
        currentPage = "menuCake";
      } else if (type === "menuDonut") {
        endCamera.set(
          targetPosition.x + 2.5,
          targetPosition.y,
          targetPosition.z + 0.4
        );
        currentPage = "menuDonut";
      }

      movingCamera = true;
      moveStartTime = performance.now();
      controls.enabled = false;

      document.getElementById("backButton").style.display = "block";

      if (type === "menuCake") {
        document.getElementById("nextButton").style.display = "block";
      } else {
        document.getElementById("nextButton").style.display = "none";
      }

    }


    /* =========================
        RAYCASTER
    ========================= */

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();


    /* =========================
        CLICK 3D MODEL
    ========================= */

    window.addEventListener("click", function(event) {

      if (!bakery) {
        return;
      }

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(
        bakery.children,
        true
      );

      if (intersects.length === 0) {
        return;
      }

      let clicked = intersects[0].object;

      while (clicked) {

        if (clicked.name === "About_me") {
          const aboutTarget = bakery.getObjectByName("About_me");
          if (aboutTarget) {
            moveCameraTo(aboutTarget, "about");
          }
          return;
        }

        if (clicked.name === "BtnMenu") {
          const menuTarget = bakery.getObjectByName("MenuCake");
          if (menuTarget) {
            moveCameraTo(menuTarget, "menuCake");
          }
          return;
        }

        if (clicked.name === "BtnPortfolio") {
          window.open(
            "https://wiphadathabpia.github.io/PortfolioBakery/",
            "_blank"
          );
          return;
        }

        clicked = clicked.parent;

      }

    });


    /* =========================
        BACK BUTTON
    ========================= */

    document.getElementById("backButton").addEventListener(
      "click",
      function() {

        if (!bakery) {
          return;
        }

        if (currentPage === "menuDonut") {
          const cakeTarget = bakery.getObjectByName("MenuCake");
          moveCameraTo(cakeTarget, "menuCake");
          return;
        }

        movingCamera = true;
        startCamera.copy(camera.position);
        startTarget.copy(controls.target);
        endCamera.copy(homeCameraPosition);
        endTarget.copy(homeTarget);
        moveStartTime = performance.now();
        currentPage = "home";
        controls.enabled = false;

        document.getElementById("backButton").style.display = "none";
        document.getElementById("nextButton").style.display = "none";

      }
    );


    /* =========================
        NEXT BUTTON
    ========================= */

    document.getElementById("nextButton").addEventListener(
      "click",
      function() {

        if (!bakery) {
          return;
        }

        const donutTarget = bakery.getObjectByName("MenuDonut");
        if (donutTarget) {
          moveCameraTo(donutTarget, "menuDonut");
        }

      }
    );


    /* =========================
        RESIZE
    ========================= */

    window.addEventListener("resize", function() {

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);

    });


    /* =========================
        ANIMATION LOOP
    ========================= */

    function animate() {

      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // ขยับ Vertex ของกันสาด (Plane.001) แบบสดๆ ผ่าน JavaScript
      if (clothMesh && originalPositions) {
        const positionAttribute = clothMesh.geometry.attributes.position;
        const heightRange = Math.max(clothMaxY - clothMinY, 0.0001);

        for (let i = 0; i < positionAttribute.count; i++) {
          const ox = originalPositions[i * 3];
          const oy = originalPositions[i * 3 + 1];
          const oz = originalPositions[i * 3 + 2];

          // คำนวณคลื่นลม
          const wave1 = Math.sin(ox * 4.0 + t * 2.0);
          const wave2 = Math.sin(oz * 3.0 - t * 1.5);
          const wave = (wave1 * 0.08 + wave2 * 0.04);

          // ให้ขอบบนนิ่ง ขอบล่างพริ้วมาก
          const edgeWeight = 1.0 - Math.max(0, Math.min(1, (oy - clothMinY) / heightRange));

          // อัปเดตตำแหน่งแกน Z และ Y
          positionAttribute.setXYZ(
            i,
            ox,
            oy + wave * 0.1 * edgeWeight,
            oz + wave * edgeWeight
          );
        }

        positionAttribute.needsUpdate = true;
      }


      if (movingCamera) {

        const elapsed = performance.now() - moveStartTime;
        let p = Math.min(elapsed / moveDuration, 1);
        p = p * p * (3 - 2 * p);

        camera.position.lerpVectors(startCamera, endCamera, p);
        controls.target.lerpVectors(startTarget, endTarget, p);
        camera.lookAt(controls.target);

        if (elapsed >= moveDuration) {
          movingCamera = false;
          controls.enabled = true;
        }

      } else {
        controls.update();
      }

      renderer.render(scene, camera);

    }

    animate();

  </script>

</body>
</html>
