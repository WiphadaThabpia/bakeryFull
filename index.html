<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Bakery 3D</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FFF4E3;
      font-family: sans-serif;
    }

    canvas {
      display: block;
    }

    #backButton,
    #nextButton {
      position: fixed;
      z-index: 10;

      padding: 12px 20px;

      border: none;
      border-radius: 10px;

      background: white;
      color: #5a3a2e;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 3px 10px rgba(0,0,0,0.2);

      display: none;
    }

    #backButton {
      left: 20px;
      top: 20px;
    }

    #nextButton {
      right: 20px;
      bottom: 20px;
    }

    #backButton:hover,
    #nextButton:hover {
      transform: scale(1.05);
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

</head>

<body>

  <button id="backButton">
    ← กลับ
  </button>

  <button id="nextButton">
    Menu Donut →
  </button>


  <script>

    /* =========================
       SCENE
    ========================= */

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0xFFF4E3);


    /* =========================
       CAMERA
    ========================= */

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );


    /* =========================
       RENDERER
    ========================= */

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.outputEncoding = THREE.sRGBEncoding;

    renderer.shadowMap.enabled = true;

    document.body.appendChild(renderer.domElement);


    /* =========================
       CONTROLS
    ========================= */

    const controls = new THREE.OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;

    controls.dampingFactor = 0.05;

    controls.minDistance = 3;

    controls.maxDistance = 30;


    /* =========================
       LIGHT
    ========================= */

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      0.45
    );

    scene.add(ambientLight);


    const mainLight = new THREE.SpotLight(
      0xffffff,
      2.5
    );

    mainLight.position.set(
      8,
      10,
      12
    );

    mainLight.castShadow = true;

    scene.add(mainLight);


    const leftLight = new THREE.SpotLight(
      0xffffff,
      1.5
    );

    leftLight.position.set(
      -8,
      6,
      8
    );

    scene.add(leftLight);


    const backLight = new THREE.DirectionalLight(
      0xffffff,
      0.5
    );

    backLight.position.set(
      -5,
      -5,
      8
    );

    scene.add(backLight);


    /* =========================
       GLB
    ========================= */

    const loader = new THREE.GLTFLoader();

    let bakery = null;

    loader.load(
      "Bekery.glb",

      function(gltf) {

        bakery = gltf.scene;

        scene.add(bakery);

        bakery.traverse(function(object) {

          if (object.isMesh) {

            object.castShadow = true;

            object.receiveShadow = true;

          }

        });


        /* =========================
           MODEL SIZE
        ========================= */

        const box = new THREE.Box3()
          .setFromObject(bakery);

        const size = box.getSize(
          new THREE.Vector3()
        );

        const center = box.getCenter(
          new THREE.Vector3()
        );


        console.log(
          "Bakery loaded"
        );

        console.log(
          "Size:",
          size
        );

        console.log(
          "Center:",
          center
        );


        /* =========================
           CHECK OBJECTS
        ========================= */

        console.log(
          "About me:",
          bakery.getObjectByName("About_me")
        );

        console.log(
          "Menu:",
          bakery.getObjectByName("BtnMenu")
        );

        console.log(
          "Portfolio:",
          bakery.getObjectByName("BtnPortfolio")
        );

        console.log(
          "Menu Cake:",
          bakery.getObjectByName("MenuCake")
        );

        console.log(
          "Menu Donut:",
          bakery.getObjectByName("MenuDonut")
        );


        /* =========================
           HOME CAMERA
        ========================= */

        camera.position.set(
          box.max.x + size.x * 1.6,
          center.y,
          center.z + size.z * 0.15
        );

        controls.target.set(
          center.x,
          center.y,
          center.z
        );

        camera.lookAt(
          controls.target
        );


        /* =========================
           SAVE HOME CAMERA
        ========================= */

        homeCameraPosition.copy(
          camera.position
        );

        homeTarget.copy(
          controls.target
        );

      },

      undefined,

      function(error) {

        console.error(
          "โหลด Bakery ไม่สำเร็จ",
          error
        );

      }
    );


    /* =========================
       CAMERA VARIABLES
    ========================= */

    const homeCameraPosition =
      new THREE.Vector3();

    const homeTarget =
      new THREE.Vector3();


    let currentPage = "home";

    let movingCamera = false;

    let moveStartTime = 0;


    const startCamera =
      new THREE.Vector3();

    const endCamera =
      new THREE.Vector3();

    const startTarget =
      new THREE.Vector3();

    const endTarget =
      new THREE.Vector3();


    const moveDuration = 1000;


    /* =========================
       MOVE CAMERA
    ========================= */

    function moveCameraTo(
      targetObject,
      type
    ) {

      if (!targetObject) {
        console.log(
          "ไม่พบ target"
        );

        return;
      }


      const targetPosition =
        new THREE.Vector3();

      targetObject.getWorldPosition(
        targetPosition
      );


      startCamera.copy(
        camera.position
      );

      startTarget.copy(
        controls.target
      );


      endTarget.copy(
        targetPosition
      );


      /* =========================
         ABOUT ME
      ========================= */

      if (type === "about") {

        const direction =
          new THREE.Vector3()
            .subVectors(
              homeCameraPosition,
              homeTarget
            )
            .normalize();


        endCamera.copy(
          targetPosition
        );


        endCamera.add(
          direction.multiplyScalar(4)
        );


        currentPage = "about";

      }


      /* =========================
         MENU CAKE
      ========================= */

      else if (type === "menuCake") {

        endCamera.set(
          targetPosition.x + 2.5,
          targetPosition.y,
          targetPosition.z + 0.4
        );

        currentPage = "menuCake";

      }


      /* =========================
         MENU DONUT
      ========================= */

      else if (type === "menuDonut") {

        endCamera.set(
          targetPosition.x + 2.5,
          targetPosition.y,
          targetPosition.z + 0.4
        );

        currentPage = "menuDonut";

      }


      movingCamera = true;

      moveStartTime =
        performance.now();

      controls.enabled = false;


      /* =========================
         BUTTONS
      ========================= */

      document
        .getElementById("backButton")
        .style.display = "block";


      if (type === "menuCake") {

        document
          .getElementById("nextButton")
          .style.display = "block";

      }
      else {

        document
          .getElementById("nextButton")
          .style.display = "none";

      }

    }


    /* =========================
       RAYCASTER
    ========================= */

    const raycaster =
      new THREE.Raycaster();

    const mouse =
      new THREE.Vector2();


    /* =========================
       CLICK 3D MODEL
    ========================= */

    window.addEventListener(
      "click",
      function(event) {

        if (!bakery) {
          return;
        }


        mouse.x =
          (event.clientX /
            window.innerWidth) * 2 - 1;

        mouse.y =
          -(event.clientY /
            window.innerHeight) * 2 + 1;


        raycaster.setFromCamera(
          mouse,
          camera
        );


        const intersects =
          raycaster.intersectObjects(
            bakery.children,
            true
          );


        if (intersects.length === 0) {

          console.log(
            "ไม่เจอ Object"
          );

          return;

        }


        let clicked =
          intersects[0].object;


        console.log(
          "Clicked:",
          clicked.name
        );


        /* =========================
           CHECK PARENT
        ========================= */

        while (clicked) {


          console.log(
            "ตรวจชื่อ:",
            clicked.name
          );


          /* =========================
             ABOUT ME
          ========================= */

          if (
            clicked.name === "About_me"
          ) {

            console.log(
              "เจอ About_me แล้ว!"
            );


            const aboutTarget =
              bakery.getObjectByName(
                "About_me"
              );


            if (aboutTarget) {

              moveCameraTo(
                aboutTarget,
                "about"
              );

            }


            return;

          }


          /* =========================
             MENU
          ========================= */

          if (
            clicked.name === "BtnMenu"
          ) {

            console.log(
              "เจอ BtnMenu"
            );


            const menuTarget =
              bakery.getObjectByName(
                "MenuCake"
              );


            if (menuTarget) {

              moveCameraTo(
                menuTarget,
                "menuCake"
              );

            }


            return;

          }


          /* =========================
             PORTFOLIO
          ========================= */

          if (
            clicked.name ===
            "BtnPortfolio"
          ) {

            console.log(
              "เจอ BtnPortfolio"
            );


            window.open(
              "https://example.com",
              "_blank"
            );


            return;

          }


          clicked =
            clicked.parent;

        }

      }
    );


    /* =========================
       BACK BUTTON
    ========================= */

    document
      .getElementById("backButton")
      .addEventListener(
        "click",
        function() {


          /* =========================
             MENU DONUT → MENU CAKE
          ========================= */

          if (
            currentPage ===
            "menuDonut"
          ) {

            const cakeTarget =
              bakery.getObjectByName(
                "MenuCake"
              );


            moveCameraTo(
              cakeTarget,
              "menuCake"
            );


            return;

          }


          /* =========================
             RETURN HOME
          ========================= */

          movingCamera = true;

          startCamera.copy(
            camera.position
          );

          startTarget.copy(
            controls.target
          );


          endCamera.copy(
            homeCameraPosition
          );

          endTarget.copy(
            homeTarget
          );


          moveStartTime =
            performance.now();


          currentPage = "home";


          controls.enabled = false;


          document
            .getElementById(
              "backButton"
            )
            .style.display = "none";


          document
            .getElementById(
              "nextButton"
            )
            .style.display = "none";

        }
      );


    /* =========================
       NEXT BUTTON
    ========================= */

    document
      .getElementById("nextButton")
      .addEventListener(
        "click",
        function() {


          const donutTarget =
            bakery.getObjectByName(
              "MenuDonut"
            );


          if (donutTarget) {

            moveCameraTo(
              donutTarget,
              "menuDonut"
            );

          }

        }
      );


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(
      "resize",
      function() {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

      }
    );


    /* =========================
       ANIMATION
    ========================= */

    function animate() {

      requestAnimationFrame(
        animate
      );


      if (movingCamera) {

        const elapsed =
          performance.now() -
          moveStartTime;


        let t =
          Math.min(
            elapsed / moveDuration,
            1
          );


        /* Smooth Step */

        t =
          t * t *
          (3 - 2 * t);


        camera.position.lerpVectors(
          startCamera,
          endCamera,
          t
        );


        controls.target.lerpVectors(
          startTarget,
          endTarget,
          t
        );


        camera.lookAt(
          controls.target
        );


        if (
          elapsed >= moveDuration
        ) {

          movingCamera = false;

          controls.enabled = true;

        }

      }
      else {

        controls.update();

      }


      renderer.render(
        scene,
        camera
      );

    }


    animate();

  </script>

</body>

</html>
